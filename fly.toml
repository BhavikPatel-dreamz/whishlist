# fly.toml app configuration file generated for wishlist-restock-worker on 2026-10-29T17:00:28+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wishlist-restock-worker'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.worker'

[env]
  NODE_ENV = 'production'
  RESTOCK_QUEUE_ENABLED = 'true'
  RESTOCK_SEND_RATE = '5'
  RESTOCK_WORKER_CONCURRENCY = '5'

[processes]
  app = 'pnpm exec tsx app/workers/restock-worker.server.ts'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
  processes = ['app']
