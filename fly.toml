# fly.toml app configuration file generated for whishlist on 2026-10-29T11:05:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'whishlist'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  PORT = '3000'
  SHOPIFY_APP_URL = 'https://whishlist.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
