# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4e30ed6de43098d44b76b8aad8d6d31a"
name = "wishlist-stock"
application_url = "https://whishlist.dreamzapps.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory"
  topics = [ "inventory_levels/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "customer_read_customers,read_companies,read_customers,read_draft_orders,read_inventory,read_locations,read_orders,read_payment_terms,read_products,read_shipping,read_themes,unauthenticated_read_checkouts,write_companies,write_customers,write_discounts,write_draft_orders,write_locations,write_merchant_managed_fulfillment_orders,write_metaobject_definitions,write_metaobjects,write_orders,write_products,write_validations"

[auth]
redirect_urls = [ "https://whishlist.dreamzapps.com/auth" ]

[app_proxy]
url = "https://whishlist.dreamzapps.com"
subpath = "wishlist-stock"
prefix = "apps"
